<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Zapfolio — LinkedIn to portfolio in two clicks">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#7c3aed" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <ellipse cx="1020" cy="120" rx="520" ry="420" fill="url(#wash)"/>
  <ellipse cx="120" cy="820" rx="420" ry="340" fill="url(#wash)"/>

  <!-- wordmark -->
  <text x="600" y="330" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-weight="800" font-size="128" letter-spacing="-4" fill="#5b21b6">zapfolio</text>

  <!-- tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#3a3a3c">LinkedIn → Portfolio website in two clicks</text>

  <!-- pill -->
  <rect x="410" y="486" width="380" height="76" rx="38" fill="#141414"/>
  <text x="600" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#ffffff">7000+ portfolios built</text>

  <!-- mock cards row -->
  <g>
    <rect x="150" y="640" width="280" height="170" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.18"/>
    <circle cx="205" cy="700" r="26" fill="#ede9fe"/>
    <rect x="250" y="682" width="140" height="14" rx="7" fill="#ddd6fe"/>
    <rect x="250" y="706" width="100" height="12" rx="6" fill="#ede9fe"/>
    <rect x="178" y="752" width="224" height="12" rx="6" fill="#f3f0fa"/>
    <rect x="178" y="774" width="180" height="12" rx="6" fill="#f3f0fa"/>

    <rect x="460" y="640" width="280" height="170" rx="18" fill="url(#btn)"/>
    <text x="600" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#ffffff">Build Yours</text>
    <text x="600" y="756" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ede9fe">two clicks. that's it.</text>

    <rect x="770" y="640" width="280" height="170" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.18"/>
    <rect x="798" y="672" width="120" height="14" rx="7" fill="#ddd6fe"/>
    <rect x="798" y="700" width="224" height="12" rx="6" fill="#f3f0fa"/>
    <rect x="798" y="722" width="200" height="12" rx="6" fill="#f3f0fa"/>
    <rect x="798" y="756" width="150" height="30" rx="15" fill="#ede9fe"/>
  </g>
</svg>
